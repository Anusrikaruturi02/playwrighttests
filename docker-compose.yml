version: '3.9'

services:

  backend:
    build: ./backend
    container_name: talent-backend
    ports:
      - '8000:8000'
    environment:
      PORT: 8000
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: talent-frontend
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000']
      interval: 10s
      timeout: 5s
      retries: 10
